# docker-compose.yml
# Docker Compose configuration for LED IAPT 4.1 Application
# Includes PostgreSQL database and pgAdmin for management

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: led_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: led_reports
      POSTGRES_USER: led_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d  # For initialization scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U led_user -d led_reports"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - led_network

  # pgAdmin - Web-based Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: led_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@led.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - led_network

volumes:
  postgres_data:
    name: led_postgres_data
  pgadmin_data:
    name: led_pgadmin_data

networks:
  led_network:
    name: led_network
    driver: bridge
